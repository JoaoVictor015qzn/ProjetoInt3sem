server {
    listen 80;
    server_name localhost;
    
    # Nginx will issue relative redirects (e.g., Location: /app/) 
    # instead of absolute (Location: http://localhost/app/)
    absolute_redirect off;

    # Rota raiz (/) -> Landing Page (React/Vite)
    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rota /app -> Dashboard Mobile (Expo Web)
    location /app/ {
        proxy_pass http://mobile:80/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Suporte a WebSocket (Fast Refresh do Expo) se necessário
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
